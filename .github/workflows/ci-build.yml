name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build
        run: |
          make build

      - name: Run
        run: |
          ./associate-eip 2>&1 | grep "usage: ./associate-eip"
